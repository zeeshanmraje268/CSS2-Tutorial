<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetshop Project</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        header{
            width: 100%;
            height: 70px;
           
            float: left;
            box-sizing: border-box;
            padding: 0 40px;
            
        }
        #brand-name{
            font-family: sans-serif;
            float: left;
            font-size: 2rem;
            color: crimson;
            margin: 0 auto;
            margin-top: 15px;
        }
        #brand-tag{
            float:right;
            font-size: 16px;
            font-family: sans-serif;
            margin-top: 25px;
        }
        nav{
            float: left;
            width: 100%;
            box-sizing: border-box;
            height: 120px;
            background-color: crimson;
            padding: 40px;
        }
        #search_cake{
            width: 90%;
            height: 40px;
            padding: 15px;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        #search-btn{
            height: 40px;
            background-color: white;
            border: none;
            color: crimson;
            width: 100px;
            cursor: pointer;
            font-weight: 600;
            font-family: sans-serif;
            
        }
        

    </style>
</head>
<body>
    <header>
        <h1 id="brand-name">Sweetshop.com</h1>
        <p id="brand-tag">India's largest sweets and backeries shop</p>
    </header>
    <nav>
        <form action="" id="form-search">
            <input type="search" name="search" id="search_cake" placeholder="Search your favourite cookie....">
            <button type="submit" id="search-btn">Search Here</button>
        </form>
    </nav>
    <section></section>
    <footer></footer>
</body>
</html>
