<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial 4</title>
    <style>
        body {
            background-color: crimson;
            font-family: sans-serif;
        }

        #outer {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #inner {
            background-color: white;
            width: 900px;
            height: 300px;
            text-align: center;
        }

        h1 {
            color: lightsalmon;
        }

        table {
            display: flex;
            justify-content: center;
            align-items: center;

        }

        td {
            background-color: olivedrab;
            width: 150px;
            height: 50px;
            color: white;
            font-size: 1rem;
        }

        h1 {
            font-size: 2.4rem;
        }
        #searchBox{
            margin-top: 20px;
        }
        input[type="search"]{
            width: 75%;
            height: 35px;
        }

        #search-btn{
            width: 75px;
            height: 35px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="outer">
        <div id="inner">
            <h1>WAP Institute</h1>
            <table>
                <tr>
                    <td>Home</td>
                    <td>Images</td>
                    <td>Videos</td>
                    <td>Movies</td>
                    <td>Contact Us</td>

                </tr>
            </table>
            <div id="searchBox">
                <input type="search" name="" id="" placeholder="Search anything">
                <button id="search-btn">Search</button>
            </div>
        </div>

    </div>
</body>

</html>
