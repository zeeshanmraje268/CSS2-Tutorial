<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial 4</title>
    <style>
        body {
            background-color: green;
        }

        .header {
            background-color: white;
            width: 1001px;
            height: 300px;
            margin: auto auto;
            text-align: center;
            padding-top: 10px;
        }

        div h1 {
            color: coral;
            text-align: center;
            font-size: 3rem;
        }

        button {
            background-color: black;
            border: none;
            color: white;
            padding: 5px;
            width: 150px;
            height: 50px;
            border-radius: 5px;
        }

        nav {
            background-color: yellow;
            margin-top: 25px;
            height: 45px;
            font-weight: bold;
            text-transform: uppercase;
            padding-top: 25px;
            font-size: 1.5rem;
            font-family: sans-serif;
        }

        input {
            height: 37px;
            text-align: center;
            font-family: 'sans-serif';
            width: 1001px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>WAP INSTITUTE</h1>
        <div>
            <button>Home</button>
            <button>About Us</button>
            <button>Services</button>
            <button>Product</button>
            <button>Contact Us</button>
        </div>
        <nav>
            Welcome to first internal website
        </nav>
        <input type="search" name="search" id="field-search" placeholder="Search this site here">
    </div>
</body>

</html>
